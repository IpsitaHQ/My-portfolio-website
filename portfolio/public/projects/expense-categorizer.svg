<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D0F1A"/>
    </linearGradient>
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FFB25E"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F2E"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="chip1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#5FA8D3" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Circuit traces (background) -->
  <g stroke="#FF8C42" stroke-width="0.6" fill="none" opacity="0.12">
    <path d="M 0,200 L 120,200 L 140,180 L 200,180 L 220,200 L 280,200"/>
    <path d="M 0,250 L 80,250 L 100,230 L 160,230 L 180,250 L 240,250 L 260,270 L 320,270"/>
    <path d="M 520,100 L 580,100 L 600,120 L 660,120 L 680,100 L 750,100"/>
    <path d="M 500,350 L 560,350 L 580,370 L 640,370 L 660,350 L 800,350"/>
    <circle cx="140" cy="180" r="2" fill="#FF8C42"/>
    <circle cx="220" cy="200" r="2" fill="#FF8C42"/>
    <circle cx="100" cy="230" r="2" fill="#FF8C42"/>
    <circle cx="260" cy="270" r="2" fill="#FF8C42"/>
    <circle cx="600" cy="120" r="2" fill="#FF8C42"/>
    <circle cx="580" cy="370" r="2" fill="#FF8C42"/>
  </g>

  <!-- Floating data streams -->
  <g font-family="monospace" font-size="9" fill="#5FA8D3" opacity="0.15">
    <text x="30" y="80">$2,450.00 → Food</text>
    <text x="50" y="120">$89.99 → Shopping</text>
    <text x="25" y="340">$120.50 → Travel</text>
    <text x="600" y="80">$55.00 → Bills</text>
    <text x="620" y="130">$340.00 → Healthcare</text>
    <text x="640" y="380">$15.99 → Food</text>
  </g>

  <!-- Neural network nodes (left side) -->
  <g filter="url(#softglow)">
    <circle cx="80" cy="150" r="4" fill="#5FA8D3" opacity="0.6"/>
    <circle cx="80" cy="225" r="4" fill="#5FA8D3" opacity="0.6"/>
    <circle cx="80" cy="300" r="4" fill="#5FA8D3" opacity="0.6"/>
    <circle cx="140" cy="120" r="3" fill="#5FA8D3" opacity="0.4"/>
    <circle cx="140" cy="180" r="3" fill="#5FA8D3" opacity="0.4"/>
    <circle cx="140" cy="240" r="3" fill="#5FA8D3" opacity="0.4"/>
    <circle cx="140" cy="300" r="3" fill="#5FA8D3" opacity="0.4"/>
    <circle cx="140" cy="360" r="3" fill="#5FA8D3" opacity="0.4"/>
    <!-- Connections -->
    <g stroke="#5FA8D3" stroke-width="0.5" opacity="0.2">
      <line x1="80" y1="150" x2="140" y2="120"/><line x1="80" y1="150" x2="140" y2="180"/>
      <line x1="80" y1="150" x2="140" y2="240"/>
      <line x1="80" y1="225" x2="140" y2="180"/><line x1="80" y1="225" x2="140" y2="240"/>
      <line x1="80" y1="225" x2="140" y2="300"/>
      <line x1="80" y1="300" x2="140" y2="300"/><line x1="80" y1="300" x2="140" y2="360"/>
    </g>
  </g>

  <!-- === MAIN ROBOT HEAD (left-center) === -->
  <g transform="translate(320, 110)">
    <!-- Head glow -->
    <ellipse cx="80" cy="100" rx="70" ry="60" fill="#FF8C42" opacity="0.06" filter="url(#bigglow)"/>

    <!-- Head shape - rounded robot head -->
    <rect x="30" y="40" width="100" height="120" rx="20" ry="20" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <!-- Inner panel -->
    <rect x="38" y="48" width="84" height="104" rx="15" ry="15" fill="#0F172A" stroke="#1E3A5F" stroke-width="0.5"/>

    <!-- Antenna -->
    <line x1="80" y1="40" x2="80" y2="18" stroke="#334155" stroke-width="2"/>
    <circle cx="80" cy="14" r="5" fill="#FF8C42" opacity="0.9" filter="url(#glow1)"/>
    <circle cx="80" cy="14" r="3" fill="#FFD700"/>

    <!-- Eyes - robotic camera lenses -->
    <circle cx="62" cy="85" r="14" fill="#0A0E1A" stroke="#334155" stroke-width="1.5"/>
    <circle cx="62" cy="85" r="10" fill="#0D1117" stroke="#FF8C42" stroke-width="0.8" opacity="0.6"/>
    <circle cx="62" cy="85" r="5" fill="#FF8C42" opacity="0.8" filter="url(#glow1)"/>
    <circle cx="60" cy="83" r="2" fill="#FFD700" opacity="0.9"/>

    <circle cx="98" cy="85" r="14" fill="#0A0E1A" stroke="#334155" stroke-width="1.5"/>
    <circle cx="98" cy="85" r="10" fill="#0D1117" stroke="#FF8C42" stroke-width="0.8" opacity="0.6"/>
    <circle cx="98" cy="85" r="5" fill="#FF8C42" opacity="0.8" filter="url(#glow1)"/>
    <circle cx="96" cy="83" r="2" fill="#FFD700" opacity="0.9"/>

    <!-- Mouth / display -->
    <rect x="55" y="110" width="50" height="18" rx="4" fill="#0A0E1A" stroke="#334155" stroke-width="0.8"/>
    <text x="60" y="123" font-family="monospace" font-size="8" fill="#FF8C42" opacity="0.9">85-95%</text>

    <!-- Jaw / chin piece -->
    <rect x="45" y="132" width="70" height="12" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <circle cx="55" cy="138" r="2" fill="#334155"/>
    <circle cx="80" cy="138" r="2" fill="#334155"/>
    <circle cx="105" cy="138" r="2" fill="#334155"/>

    <!-- Side panels -->
    <rect x="18" y="60" width="12" height="40" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <rect x="130" y="60" width="12" height="40" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <!-- Side LEDs -->
    <circle cx="24" cy="70" r="2" fill="#5FA8D3" opacity="0.7"/>
    <circle cx="24" cy="80" r="2" fill="#FF8C42" opacity="0.7"/>
    <circle cx="24" cy="90" r="2" fill="#5FA8D3" opacity="0.7"/>
    <circle cx="136" cy="70" r="2" fill="#5FA8D3" opacity="0.7"/>
    <circle cx="136" cy="80" r="2" fill="#FF8C42" opacity="0.7"/>
    <circle cx="136" cy="90" r="2" fill="#5FA8D3" opacity="0.7"/>
  </g>

  <!-- Category classification outputs (right side) -->
  <g transform="translate(540, 80)">
    <!-- Floating category cards -->
    <g filter="url(#glow1)">
      <!-- Food -->
      <rect x="0" y="0" width="180" height="36" rx="6" fill="#111827" stroke="#FF8C42" stroke-width="0.8" opacity="0.9"/>
      <circle cx="20" cy="18" r="6" fill="#FF8C42" opacity="0.3"/>
      <text x="14" y="22" font-family="monospace" font-size="7" fill="#FF8C42">$</text>
      <text x="34" y="16" font-family="sans-serif" font-size="10" fill="#F5F5F0" font-weight="600">Food &amp; Dining</text>
      <text x="34" y="28" font-family="monospace" font-size="7" fill="#5FA8D3">92% confidence</text>

      <!-- Shopping -->
      <rect x="10" y="50" width="180" height="36" rx="6" fill="#111827" stroke="#A9D6E5" stroke-width="0.6" opacity="0.8"/>
      <circle cx="30" cy="68" r="6" fill="#A9D6E5" opacity="0.3"/>
      <text x="24" y="72" font-family="monospace" font-size="7" fill="#A9D6E5">#</text>
      <text x="44" y="66" font-family="sans-serif" font-size="10" fill="#F5F5F0" font-weight="600">Shopping</text>
      <text x="44" y="78" font-family="monospace" font-size="7" fill="#5FA8D3">87% confidence</text>

      <!-- Travel -->
      <rect x="5" y="100" width="180" height="36" rx="6" fill="#111827" stroke="#FF8C42" stroke-width="0.6" opacity="0.7"/>
      <circle cx="25" cy="118" r="6" fill="#FF8C42" opacity="0.2"/>
      <text x="19" y="122" font-family="monospace" font-size="7" fill="#FF8C42">!</text>
      <text x="39" y="116" font-family="sans-serif" font-size="10" fill="#F5F5F0" font-weight="600">Travel</text>
      <text x="39" y="128" font-family="monospace" font-size="7" fill="#5FA8D3">95% confidence</text>

      <!-- Bills -->
      <rect x="15" y="150" width="180" height="36" rx="6" fill="#111827" stroke="#A9D6E5" stroke-width="0.5" opacity="0.6"/>
      <circle cx="35" cy="168" r="6" fill="#A9D6E5" opacity="0.2"/>
      <text x="29" y="172" font-family="monospace" font-size="7" fill="#A9D6E5">+</text>
      <text x="49" y="166" font-family="sans-serif" font-size="10" fill="#F5F5F0" font-weight="600">Bills &amp; Utilities</text>
      <text x="49" y="178" font-family="monospace" font-size="7" fill="#5FA8D3">89% confidence</text>
    </g>

    <!-- Connecting lines from robot to cards -->
    <g stroke="#FF8C42" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4">
      <path d="M -10,100 Q 50,80 0,18" fill="none"/>
      <path d="M -10,100 Q 40,100 10,68" fill="none"/>
      <path d="M -10,100 Q 30,120 5,118" fill="none"/>
      <path d="M -10,100 Q 20,140 15,168" fill="none"/>
    </g>
  </g>

  <!-- Data flow particles -->
  <g filter="url(#glow1)">
    <circle cx="420" cy="200" r="2" fill="#FF8C42" opacity="0.6"/>
    <circle cx="450" cy="170" r="1.5" fill="#FFB25E" opacity="0.5"/>
    <circle cx="470" cy="220" r="1.8" fill="#FF8C42" opacity="0.4"/>
    <circle cx="440" cy="250" r="1.5" fill="#5FA8D3" opacity="0.5"/>
    <circle cx="480" cy="290" r="2" fill="#5FA8D3" opacity="0.4"/>
    <circle cx="460" cy="320" r="1.2" fill="#FFB25E" opacity="0.5"/>
    <circle cx="500" cy="150" r="1.5" fill="#A9D6E5" opacity="0.4"/>
    <circle cx="510" cy="350" r="1.8" fill="#FF8C42" opacity="0.3"/>
  </g>

  <!-- Bottom bar - scanline effect -->
  <rect x="0" y="420" width="800" height="30" fill="#0A0E1A" opacity="0.6"/>
  <g font-family="monospace" font-size="8" fill="#5FA8D3" opacity="0.25">
    <text x="20" y="438">TF-IDFVectorizer</text>
    <text x="160" y="438">LogisticRegression</text>
    <text x="320" y="438">Streamlit v1.32</text>
    <text x="460" y="438">6 Categories</text>
    <text x="570" y="438">batch processing</text>
    <text x="700" y="438">CSV export</text>
  </g>

  <!-- Bottom edge glow -->
  <rect x="0" y="448" width="800" height="2" fill="url(#neon1)" opacity="0.3"/>
</svg>